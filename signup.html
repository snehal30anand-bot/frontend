<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Sign Up</title>
    <link rel="stylesheet" href="style.css"> </head>
<body>
    <div class="login-container">
        <h2>Create an Account</h2>
        <form action="/api/register" method="POST">
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="input-group">
                <label for="password">Choose Password</label>
                <input type="password" id="password" name="password" placeholder="Minimum 8 characters" required minlength="8">
            </div>
            <div class="input-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter password" required>
            </div>
            
            <button type="submit" class="login-button">Sign Up</button>
        </form>
        <p class="signup-link">
            Already have an account? <a href="C:\Users\shreya\major project\Frontend\Register.html">Log In Here</a>
        </p>
    </div>
</body>
</html>
